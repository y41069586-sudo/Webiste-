# Lokaler Start:      docker compose up --build
# Produktion (VPS):   docker compose --profile prod up -d --build   (mit Caddy + TLS)
name: wbm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wbm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wbm}
      POSTGRES_DB: wbm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wbm -d wbm']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wbm:wbm@postgres:5432/wbm}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-localhost:3000}
      TRACK_DOMAIN: ${TRACK_DOMAIN:-localhost:3000}
      STORAGE_LOCAL_DIR: /data/storage
      NODE_ENV: production
      WORKER_HEALTH_PORT: 3001
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wbm:wbm@postgres:5432/wbm}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-localhost:3000}
      TRACK_DOMAIN: ${TRACK_DOMAIN:-localhost:3000}
      STORAGE_LOCAL_DIR: /data/storage
      NODE_ENV: production
    volumes:
      - storage:/data/storage
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: wbm
      PGPASSWORD: ${POSTGRES_PASSWORD:-wbm}
      PGDATABASE: wbm
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    volumes:
      - ./backups:/backups
      - storage:/data/storage:ro
      - ./infra/backup:/scripts:ro
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ['prod']
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
