- id: GASTRO_SPEISEKARTE_ONLINE
  text_de: '53 % schauen sich in der Regel online die Speisekarte an, bevor sie ein neues Restaurant oder Café besuchen, bei den 16- bis 29-Jährigen sind es 65 %.'
  footnote_de: 'Bitkom Research 2024, 1.005 Befragte ab 16 Jahren, telefonisch, repräsentativ'
  source_publisher: Bitkom e. V.
  source_title: 'Restaurants und Cafés: Für knapp ein Drittel sind Online-Bewertungen entscheidend'
  source_url: https://www.bitkom.org/Presse/Presseinformation/Restaurants-und-Cafes-Online-Bewertungen-entscheidend
  published_at: 2024-06-27
  sample: 1005
  population: Personen in Deutschland ab 16 Jahren (telefonisch, KW 18–21 2024)
  scope: DE
  industries: [gastronomie]
  source_type: external
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: 'Über die Hälfte (53 Prozent) schaut sich dabei in der Regel online die Speisekarte an, bevor sie ein neues Restaurant oder Café besucht. Unter den 16- bis 29-Jährigen haben sogar knapp zwei Drittel (65 Prozent) diese Angewohnheit.'
    note: 'Im Original geht es um ein NEUES Restaurant oder Café – das fehlte in der Startfassung. Quelle abgelaufen am 27.06.2026.'

