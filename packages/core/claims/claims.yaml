- id: HANDWERK_EMPFEHLUNG_PLUS_WEBSITE
  text_de: '83 % holen sich bei der Wahl eines Handwerksbetriebs Rat bei Freunden, Familie oder Kollegen, 26 % schauen sich die Websites infrage kommender Betriebe an.'
  footnote_de: 'Bitkom Research 2025, 1.004 Befragte ab 16 Jahren, repräsentativ'
  source_publisher: Bitkom e. V.
  source_title: 'Handwerkersuche: Persönliches Gespräch schlägt Infos im Netz'
  source_url: https://www.bitkom.org/Presse/Presseinformation/Handwerkersuche-Gespraech-schlaegt-Netz
  published_at: 2025-06-12
  sample: 1004
  population: Personen in Deutschland ab 16 Jahren (KW 7–10 2025)
  scope: DE
  industries: [handwerk]
  source_type: external
  note: 'Ehrlich verwenden: Empfehlung ist der Hauptweg, die Website ist der Check danach.'
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: '8 von 10 Deutschen holen sich bei der Entscheidung für einen Handwerksbetrieb Rat im persönlichen Gespräch mit dem Freundeskreis, der Familie oder Kolleginnen und Kollegen (83 Prozent). … etwa ein Viertel klickt sich durch die Webseiten möglicher Betriebe (26 Prozent).'
    note: 'Startfassung sagte „zusätzlich“ – die Quelle sagt nicht, dass die 26 % eine Teilmenge der 83 % sind (Mehrfachnennung). „zusätzlich“ gestrichen.'

