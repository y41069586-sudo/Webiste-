# Claims-Bibliothek (Update 2, B1/B2).
#
# Briefe und Demos referenzieren Zahlen nur per Claim-ID; der Text wird von hier eingesetzt.
# Diese Datei ist die Quelle für Text, Quelle und Prüfergebnis. Der Status in der Datenbank
# (approved/blocked) wird NUR im Dashboard durch den Betreiber gesetzt bzw. vom Ablauf-Job.
# Ändert sich text_de/footnote_de/source_url eines Claims, fällt er automatisch auf
# needs_verification zurück und braucht eine neue Freigabe.
#
# Felder unter `check`: Ergebnis der Quellenprüfung (Details: docs/claims-verifikation.md)
#   result: ok | corrected | primary_missing | mismatch
#   quote:  Wortlaut der Quelle, auf den sich der Claim stützt
#
# Regeln für neue Claims: Primärquelle, Stichprobe und Jahr bekannt, nicht älter als 3 Jahre,
# Wortlaut exakt. Jeder neue Claim startet als needs_verification.

- id: GASTRO_WEBSITE_ERWARTET
  text_de: '69 % der Menschen in Deutschland erwarten, dass ein Café oder Restaurant einen Internetauftritt hat, auf dem sich zum Beispiel Fotos der Speisen und Räumlichkeiten ansehen lassen.'
  footnote_de: 'Bitkom Research 2024, 1.005 Befragte ab 16 Jahren, telefonisch, repräsentativ'
  source_publisher: Bitkom e. V.
  source_title: 'Restaurants und Cafés: Für knapp ein Drittel sind Online-Bewertungen entscheidend'
  source_url: https://www.bitkom.org/Presse/Presseinformation/Restaurants-und-Cafes-Online-Bewertungen-entscheidend
  published_at: 2024-06-27
  sample: 1005
  population: Personen in Deutschland ab 16 Jahren (telefonisch, KW 18–21 2024)
  scope: DE
  industries: [gastronomie]
  source_type: external
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: 'Dementsprechend erwartet generell die große Mehrheit von 69 Prozent, dass ein Café oder Restaurant einen Internetauftritt hat, wo sich zum Beispiel Fotos der Speisen und Räumlichkeiten anschauen lassen.'
    note: 'Startfassung sagte „Website mit Fotos von Speisen und Räumen“ – im Original nur „zum Beispiel“. Quelle älter als 24 Monate (abgelaufen am 27.06.2026).'

