  population: Personen in Deutschland ab 16 Jahren, davon Nutzer/Interessierte der Online-Terminvereinbarung
  scope: DE
  industries: [beauty, kurse_training, dienstleistung]
  source_type: external
  note: 'Kurzform von TERMIN_KEIN_TELEFONAT (B4.3). Nur direkt nach TERMIN_ONLINE_GEWOHNT verwenden („sie“ = Menschen, die Arzttermine online vereinbaren); die Fußnote muss sagen, dass es um Arzttermine ging.'
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: 'Als größter Vorteil der digitalen Terminbuchung gilt die Unabhängigkeit von den telefonischen Erreichbarkeiten der Praxen: 84 Prozent der Befragten, die die Online-Terminvereinbarung nutzen oder sich dies vorstellen können, nennen diesen Punkt.'
    note: 'Vorgeschlagene Kurzform „lange Telefonate zu vermeiden“ steht so nicht in der Quelle; an „Unabhängigkeit von den telefonischen Erreichbarkeiten“ angepasst.'

