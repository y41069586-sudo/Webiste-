  text_de: 'Als größten Vorteil nennen sie, nicht von der telefonischen Erreichbarkeit der Praxis abhängig zu sein.'
  footnote_de: 'Bitkom Research 2025 zu Arztterminen, 1.145 Befragte ab 16 Jahren, telefonisch'
  source_publisher: Bitkom e. V.
  source_title: 'Zwei Drittel vereinbaren Arzttermine online'
