- id: TERMIN_ONLINE_GEWOHNT
  text_de: '64 % der Menschen in Deutschland haben schon einmal einen Arzttermin online vereinbart – 2023 waren es noch 36 %.'
  footnote_de: 'Bitkom Research 2025, 1.145 Befragte ab 16 Jahren, telefonisch, repräsentativ'
  source_publisher: Bitkom e. V.
  source_title: 'Zwei Drittel vereinbaren Arzttermine online'
  source_url: https://www.bitkom.org/Presse/Presseinformation/Zwei-Drittel-vereinbaren-Arzttermine-online
  published_at: 2025-12-22
  sample: 1145
  population: Personen in Deutschland ab 16 Jahren (telefonisch, KW 38–43 2025)
  scope: DE
  industries: [beauty, kurse_training, dienstleistung]
  source_type: external
  note: 'Nur als Beleg für Gewohnheit verwenden („kennen Online-Buchung schon vom Arzt“). NIE behaupten, dass Kundinnen von Kosmetikstudios zu 64 % online buchen.'
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: 'Bereits 64 Prozent der Deutschen haben inzwischen mindestens einmal einen Arzttermin online vereinbart. Damit ist der Anteil innerhalb von zwei Jahren stark gestiegen: 2024 lag er noch bei 50 Prozent, 2023 sogar erst bei 36 Prozent.'
    note: 'Quelle von Ärzteblatt (Sekundärbericht, 23.12.2025) auf die Bitkom-Presseinformation (Primärquelle, 22.12.2025) umgestellt; „gebucht“ → „vereinbart“ wie im Original.'

- id: TERMIN_KEIN_TELEFONAT
  text_de: '84 % derer, die Arzttermine online vereinbaren oder es sich vorstellen können, schätzen daran, nicht von der telefonischen Erreichbarkeit der Praxis abhängig zu sein.'
  footnote_de: 'Bitkom Research 2025 zu Arztterminen, 1.145 Befragte ab 16 Jahren, telefonisch'
  source_publisher: Bitkom e. V.
  source_title: 'Zwei Drittel vereinbaren Arzttermine online'
  source_url: https://www.bitkom.org/Presse/Presseinformation/Zwei-Drittel-vereinbaren-Arzttermine-online
  published_at: 2025-12-22
  sample: 1145
  population: Personen in Deutschland ab 16 Jahren, davon Nutzer/Interessierte der Online-Terminvereinbarung
  scope: DE
  industries: [beauty, kurse_training, dienstleistung]
  source_type: external
  check:
    checked_at: 2026-10-23
    result: corrected
    quote: 'Als größter Vorteil der digitalen Terminbuchung gilt die Unabhängigkeit von den telefonischen Erreichbarkeiten der Praxen: 84 Prozent der Befragten, die die Online-Terminvereinbarung nutzen oder sich dies vorstellen können, nennen diesen Punkt.'
    note: 'Startfassung „keine langen Telefonate“ steht so nicht in der Quelle; Wortlaut an „Unabhängigkeit von den telefonischen Erreichbarkeiten“ angepasst. Primärquelle statt Ärzteblatt.'

