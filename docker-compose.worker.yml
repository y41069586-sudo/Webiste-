# Späterer VPS-Betrieb: nur Worker, KEINE zweite PostgreSQL-Instanz und keine Web-/DNS-Veröffentlichung.
# Vor Start: .env.worker geschützt bereitstellen und Queue separat abnehmen.
name: seitenwerk-worker
services:
  worker:
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env.worker
        required: true
    environment:
      NODE_ENV: production
      APP_NAME: wbm-worker
      DRY_RUN: 'true'
      RUN_MIGRATIONS: 'false'
      BOSS_MIGRATE: 'false'
      BOSS_CREATE_QUEUES: 'false'
      BOSS_SUPERVISE: 'true'
      BOSS_SCHEDULE: 'true'
      DB_POOL_MAX: '2'
      BOSS_POOL_MAX: '2'
      WORKER_HEALTH_PORT: '3001'
      WORKER_HEALTH_HOST: 127.0.0.1
      STORAGE_DRIVER: s3
      # Wöchentlicher OSM-Auszug (Geofabrik NRW, ca. 0,8 GB) für die Lead-Suche
      OSM_EXTRACT_DIR: /data/osm
      AUTO_SEND: 'false'
      AUTO_REPLY: 'false'
      AUTO_OPTIMIZE: 'false'
      AUTO_ACTIVATE_VARIANTS: 'false'
      ALLOW_REAL_LETTERS: 'false'
      LXP_MODE: test
      REGISTRAR_ENV: sandbox
      SITE_INDEXABLE: 'false'
    read_only: true
    volumes:
      - osm-data:/data/osm
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512m
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  osm-data:
